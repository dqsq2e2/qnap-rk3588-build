name: build-qts-g98

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/powershell || true
          df -h /

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache pv gdisk unzip gzip cpio wget curl git
          # u-boot make.sh 硬性检查 `which python2`，但 PYTHON 仅 pylibfdt
          # （不编译）使用；Ubuntu 24.04 无 python2 包，垫片即可
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python2

      - name: Cache QNAP downloads
        uses: actions/cache@v4
        with:
          path: |
            qnap-kernel/qnap_kernel_*
            qnap-kernel/cross_toolchain.tar.gz
            qnap-kernel/aarch64-QNAP-linux-gnu
            qnap-firmware/*.zip
          key: qnap-dl-${{ hashFiles('boards/qnap_build.conf') }}

      - name: Build DOM image
        run: |
          git config --global user.email "ci@localhost"
          git config --global user.name "ci"
          git config --global --add safe.directory "$PWD"
          # create_dom.sh 必须 root 整跑：initrd cpio 解包需 mknod，
          # 镜像组装需 loop mount/dd
          sudo -E bash ./create_dom.sh

      - name: Upload DOM image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: g98-rk3588-emmc-dom
          path: |
            g98-rk3588-emmc*.zip
            g98-rk3588-emmc*.img
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_logs/
            u-boot/u-boot-qnap/build.log
          if-no-files-found: ignore
          retention-days: 7
