# 内核配置管理器（最终修复版）
kernel_config_manager() {
    local version=$1
    local config_file=$2
    
    # declare -A config_matrix=(
        # ["PCIe-电源节电"]=$'# CONFIG_PCIEASPM_DEFAULT is not set\nCONFIG_PCIEASPM_POWER_SUPERSAVE=y'
        # ["FAN-pwm风扇"]="CONFIG_SENSORS_PWM_FAN=y"
    # )

    # 配置项矩阵（与原有flags保持风格统一）
	#rock-5c 不需要["SATA-倍增"]="CONFIG_SATA_PMP=y"
	#rock-5c 不需要["PCIe-电源节电"]="# CONFIG_PCIEASPM_DEFAULT is not set\nCONFIG_PCIEASPM_POWER_SUPERSAVE=y"
    declare -A config_matrix=(
		["PCIe-电源节电"]="# CONFIG_PCIEASPM_DEFAULT is not set\nCONFIG_PCIEASPM_POWER_SUPERSAVE=y"
        ["UHID-蓝牙遥控"]="CONFIG_UHID=m"
        ["LED-心跳包"]="CONFIG_LEDS_TRIGGER_HEARTBEAT=m"
        ["RTC"]="CONFIG_RTC_DRV_HYM8563=y\nCONFIG_RTC_DRV_RK808=y"
        ["FAN-pwm风扇"]="CONFIG_SENSORS_PWM_FAN=y"
        ["AIC8800-蓝牙wifi驱动"]="CONFIG_AIC_WLAN_SUPPORT=y\nCONFIG_AIC8800_WLAN_SUPPORT=m\nCONFIG_AIC_LOADFW_SUPPORT=m"
        ["IRC-红外遥控"]="CONFIG_ROCKCHIP_REMOTECTL=y\nCONFIG_ROCKCHIP_REMOTECTL_PWM=y"
    )

    # 根据版本应用配置
    case $version in
        510)
            config_matrix["510-特有配置"]="CONFIG_510_SPECIAL=y"
            ;;
        523)
            config_matrix["523-新硬件支持"]="CONFIG_NEW_HARDWARE=y"
            ;;
    esac

    # 安全处理配置项（修复正则表达式）
    for key in "${!config_matrix[@]}"; do
        echo "[INFO] 处理配置组: $key"
        while IFS= read -r entry; do
            # 使用参数扩展代替awk（避免正则表达式问题）
            if [[ "$entry" =~ ^# ]]; then
                param="${entry#\#}"      # 移除注释符号
                param="${param%%[= ]*}" # 提取第一个参数
                param="${param// /}"     # 移除空格
            else
                param="${entry%%[= ]*}" # 提取等号/空格前的参数
            fi
            
            # 使用精确匹配模式
            sed -i "/^[# ]*${param}[ =]/d" "$config_file"
        done < <(printf "%s\n" "${config_matrix[$key]}")
    done

    # 批量写入优化（使用$'...'处理换行）
    {
        for key in "${!config_matrix[@]}"; do
            printf "# QNAP定制: %s\n" "$key"
            printf "%b\n" "${config_matrix[$key]}"
        done
    } >> "$config_file"
}