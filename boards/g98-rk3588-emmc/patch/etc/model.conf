# 8 个千兆口是两颗 YT9215 的 DSA 用户口：/sys 设备是 MDIO 挂载的交换机芯片，
# 闭源 HAL 枚举时判定"不是网卡"（hal_app --nic_get_info 对 eth2-9 报 not exist），
# QVS 页面永远建不了模型。故 model.conf 只声明 2 个 2.5G 口（PCI 域必须写对：
# 0002:21->DEV_DOMAIN=2，0003:31->DEV_DOMAIN=3，缺了会被当成外接未知卡），
# INTERNAL/MAX_NET_PORT_NUM=2；lan 口由 g98_rename_nics 命名 eth2-9，
# 链路层正常工作，QTS 体系外用命令行管理。

