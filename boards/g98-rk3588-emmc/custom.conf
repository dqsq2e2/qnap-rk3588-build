#!/usr/bin/env bash

# 公共配置
# G98 无专用 uboot 适配：通用 rk3588_defconfig 已带 QNAP 全套尾巴
# （115200、BOOTARGS qnap_model=ts642、RK3588_115200MINIALL.ini、ENV_IS_IN_MMC），
# 且原厂 uboot dtb 即为 rk3588-evb（eMMC/SFC/UART2 全在其中），与 defconfig 默认
# CONFIG_DEFAULT_DEVICE_TREE="rk3588-evb" 一致。
UBOOT_CONFIG="rk3588"
DTS_FILES="rk3588-bdy-g98-emmc"

# 内核版本配置 (510/520/523)
COMMON_510_KERNEL_CFLAGS='-DTSX42 -DQNAP -DARM_RK -DNAS_VIRTUAL -DNAS_VIRTUAL_EX -DQNAP_FNOTIFY -DQNAP_SEARCH_FILENAME_CASE_INSENSITIVE -DQNAP_HAL -DSUPPORT_VAAI -DQNAP_I2C_MV9235 -DSUPPORT_FAST_BLOCK_CLONE -DSUPPORT_LOGICAL_BLOCK_4KB_FROM_NAS_GUI -DSUPPORT_CONCURRENT_TASKS -DSUPPORT_SINGLE_INIT_LOGIN -DVIRTUAL_JBOD -DSUPPORT_VOLUME_BASED -DQTS_HA -DSUPPORT_TP -DNFS_VAAI -DNFS_VAAI_V3 -DNFS_QLOG -DQNAP_NFS_FORCE_UMASK -DQNAP_SNAPSHOT -DISCSI_MULTI_INIT_ACL -DUSE_BLKDEV_READPAGES -DUSE_BLKDEV_WRITEPAGES -DKSWAPD_FIX -DQNAP_KERNEL_STORAGE_V2'
COMMON_510_MODULE_CFLAGS='-DTSX42 -DQNAP -DARM_RK -DNAS_VIRTUAL -DNAS_VIRTUAL_EX -DQNAP_FNOTIFY -DQNAP_SEARCH_FILENAME_CASE_INSENSITIVE -DQNAP_HAL -DSUPPORT_VAAI -DQNAP_I2C_MV9235 -DSUPPORT_FAST_BLOCK_CLONE -DSUPPORT_LOGICAL_BLOCK_4KB_FROM_NAS_GUI -DSUPPORT_CONCURRENT_TASKS -DSUPPORT_SINGLE_INIT_LOGIN -DVIRTUAL_JBOD -DSUPPORT_VOLUME_BASED -DQTS_HA -DSUPPORT_TP -DNFS_VAAI -DNFS_VAAI_V3 -DNFS_QLOG -DQNAP_NFS_FORCE_UMASK -DQNAP_SNAPSHOT -DISCSI_MULTI_INIT_ACL -DUSE_BLKDEV_READPAGES -DUSE_BLKDEV_WRITEPAGES -DKSWAPD_FIX -DQNAP_KERNEL_STORAGE_V2 -DMODULE'

declare -g -A KERNEL_CFLAGS=(
    [510]="$COMMON_510_KERNEL_CFLAGS"
    [520]="$COMMON_510_KERNEL_CFLAGS"
    [523]="$COMMON_510_KERNEL_CFLAGS"
)

declare -g -A MODULE_CFLAGS=(
    [510]="$COMMON_510_MODULE_CFLAGS"
    [520]="$COMMON_510_MODULE_CFLAGS"
    [523]="$COMMON_510_MODULE_CFLAGS"
)

# 内核补丁：G98 无 wifi(0005-0007 aic8800)、无红外(0011)、无 ASM1064(0027)、
# 无 RTL8211F(0031)、无 rk805 电源键(0026)，均不应用；
# 0032/0033 为 G98 的 YT921x 交换机 DSA 驱动（主线 mmyangfl 版回移 5.10，
# 修改版源留档 kernel-dsa-yt921x/；0033 为 Kconfig/Makefile 挂钩，若与内核
# 上下文不符会被构建脚本警告跳过，届时按锚点手工补即可，不连累驱动本体）
COMMON_510_KERNEL_PATCH_SET="
	0001-add-qnap-QND_FNOTIFY-QND_HAL-Kconfig.patch
	0002-fix-qnap-rockchip-pwm.patch
	0008-LINUX_COMPILE_BY-r-MT.patch
	0009-P010-P210-support.patch
	0012-qnap-rockchip-pwm-fan-v1.1.patch
	0032-add-yt921x-dsa-driver.patch
	0033-yt921x-dsa-build-hooks.patch
	"

declare -g -A KERNEL_PATCH_SET=(
    [510]="$COMMON_510_KERNEL_PATCH_SET"
    [520]="$COMMON_510_KERNEL_PATCH_SET"
    [523]="$COMMON_510_KERNEL_PATCH_SET"
)

# DTB补丁：G98 dts 未引用 rk-ir.h 等新增头文件，无需 DTB 补丁
declare -g -A DTB_PATCH_SET=(
    [510]=""
    [520]=""
    [523]=""
)

# 内核配置管理器
kernel_config_manager() {
    local version=$1
    local config_file=$2

    declare -A config_matrix=(
	["PCIe-电源节电"]="# CONFIG_PCIEASPM_DEFAULT is not set\nCONFIG_PCIEASPM_POWER_SUPERSAVE=y"
        ["LED-心跳包"]="CONFIG_LEDS_TRIGGER_HEARTBEAT=m"
        ["RTC"]="CONFIG_RTC_DRV_HYM8563=y\nCONFIG_RTC_DRV_RK808=y"
        ["FAN-pwm风扇"]="CONFIG_SENSORS_PWM_FAN=y"
        # QNAP 内核树没有 r8125 厂商驱动源码（CONFIG_R8125 是死配置），库存预编译
        # r8125.ko 与自编译内核 ABI 不匹配 oops（与 ipv6/cfg80211/bonding 同模式）。
        # 改用主线 r8169：5.10.60 已支持 RTL8125B（XID 0x641 -> VER_63），
        # 需配合 rtl_nic/rtl8125b-2.fw 固件（已放 patch/lib/firmware/ 与 INITRD）
        ["R8169-双2.5G网卡"]="CONFIG_R8169=y"
        ["GMAC-交换机固定链路"]="CONFIG_STMMAC_ETH=y\nCONFIG_DWMAC_ROCKCHIP=y"
        ["NVMe-双M2"]="CONFIG_BLK_DEV_NVME=y"
        ["I2C-GPIO-HDMI-DDC"]="CONFIG_I2C_GPIO=y"
        # QNAP 库存 ipv6.ko 在自编译内核上 oops（ndisc_netdev_event 空指针），
        # 进程持 RTNL 锁死亡导致后续一切网络初始化死锁。IPV6 内置后 QTS 脚本
        # insmod 库存模块会无害失败；BRIDGE 随之可 =y，NET_DSA 三件套全内置，
        # 交换机内核启动即 probe，不再依赖 patch_front 加载时机
        ["IPV6-内置"]="CONFIG_IPV6=y"
        ["BRIDGE-内置"]="CONFIG_BRIDGE=y"
        # 库存 bonding.ko 同样在 register_netdevice 路径崩溃（bond_init 空指针），
        # 与 ipv6/cfg80211 同一模式，一并内置化
        ["BONDING-内置"]="CONFIG_BONDING=y"
        ["YT9215-DSA交换机"]="CONFIG_NET_DSA=y\nCONFIG_NET_DSA_YT921X=y\nCONFIG_NET_DSA_TAG_YT921X=y"
    )

    # 根据版本应用配置
    case $version in
        520)
            ;;
        523)
            ;;
    esac

    # 安全处理配置项
    for key in "${!config_matrix[@]}"; do
        echo "[INFO] 处理配置组: $key"
        while read -r entry; do
            if [[ $entry == "#"* ]]; then
                param=$(awk '{gsub(/^# +|([ =].*)/, ""); print}' <<< "$entry")
            else
                param=$(cut -d= -f1 <<< "$entry")
            fi

            sed -i "/^[# ]*${param}[ =]/d" "$config_file"
        done <<< $(echo -e "${config_matrix[$key]}")
    done

    # 批量写入
    {
        for key in "${!config_matrix[@]}"; do
            echo -e "\n# QNAP定制: $key"
            echo -e "${config_matrix[$key]}"
        done
    } >> "$config_file"

}
