# 内核配置管理器（最终修复版）
kernel_config_manager() {
    local version=$1
    local config_file=$2
    
	#rock-5c 不需要["SATA-倍增"]="CONFIG_SATA_PMP=y"
	#rock-5c 不需要["PCIe-电源节电"]="# CONFIG_PCIEASPM_DEFAULT is not set\nCONFIG_PCIEASPM_POWER_SUPERSAVE=y"

    declare -A config_matrix=(
		["PCIe-电源节电"]="# CONFIG_PCIEASPM_DEFAULT is not set\nCONFIG_PCIEASPM_POWER_SUPERSAVE=y"
		["SATA-倍增"]="CONFIG_SATA_PMP=y"
        ["UHID-蓝牙遥控"]="CONFIG_UHID=m"
        ["BLUE-蓝牙驱动"]="CONFIG_BT_HCIBTUSB_RTLBTUSB=m\nCONFIG_BT_HCIBTSDIO=y\nCONFIG_BT_HCIBTSDIO=y\nCONFIG_BT_HCIUART=y"
        ["WIFI-ROCKCHIP"]="CONFIG_WL_ROCKCHIP=m\nCONFIG_WIFI_BUILD_MODULE=y"
        ["WIFI-BCMDHD"]="CONFIG_BCMDHD=y\nCONFIG_AP6XXX=m\nCONFIG_BCMDHD_PCIE=y"
        ["WIFI-fw路径"]="CONFIG_BCMDHD_FW_PATH=\"/lib/firmware/fw_bcmdhd.bin\"\nCONFIG_BCMDHD_NVRAM_PATH=\"/lib/firmware/nvram.txt\""
		["BLUE-HCIUART"]="CONFIG_BT_HCIUART_BCM=y\nCONFIG_BT_HCIUART_RTL=y"
        ["LED-心跳包"]="CONFIG_LEDS_TRIGGER_HEARTBEAT=m"
		["PINCTRL-805"]="CONFIG_PINCTRL_RK805=y"
		["GPIO-firefly"]="CONFIG_GPIO_FIREFLY_GL3321G=y\nCONFIG_GPIO_FIREFLY=y"
        ["RTC"]="CONFIG_RTC_DRV_HYM8563=y\nCONFIG_RTC_DRV_RK808=y"
        ["WIFI-PATCH"]="CONFIG_PCIE_RK_THREADED_INIT=y\nCONFIG_ROCKCHIP_IOMUX=y"
        ["FAN-pwm风扇"]="CONFIG_SENSORS_PWM_FAN=y"
        ["IRC-红外遥控"]="CONFIG_ROCKCHIP_REMOTECTL=y\nCONFIG_ROCKCHIP_REMOTECTL_PWM=y"
    )

    # 根据版本应用配置
    case $version in
        520)
            config_matrix["510-特有配置"]="CONFIG_test1=y"
            ;;
        523)
            config_matrix["523-新硬件支持"]="CONFIG_test2=y"
            ;;
    esac

    # 安全处理配置项（修复正则表达式）
    for key in "${!config_matrix[@]}"; do
        echo "[INFO] 处理配置组: $key"
        while read -r entry; do
            # 参数提取器（兼容QNAP风格注释）
            if [[ $entry == "#"* ]]; then
                param=$(awk '{gsub(/^# +|([ =].*)/, ""); print}' <<< "$entry")
            else
                param=$(cut -d= -f1 <<< "$entry")
            fi
            
            # 安全删除模式（保留其他配置项）
            sed -i "/^[# ]*${param}[ =]/d" "$config_file"
        done <<< $(echo -e "${config_matrix[$key]}")
    done


    # 批量写入优化（使用$'...'处理换行）
    {
        for key in "${!config_matrix[@]}"; do
            echo -e "\n# QNAP定制: $key"
            echo -e "${config_matrix[$key]}"
        done
    } >> "$config_file"

}